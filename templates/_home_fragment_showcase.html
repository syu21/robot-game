<div class="world-env-card">
  <div><b>ロボ展示</b></div>
  <div class="upgrade-cost">看板ロボを3体まで表示しています。</div>
  {% for row in showcase_rows %}
  <div class="home-ranking-row">
    <div>
      <b>{{ row.get('robot_name') or '展示ロボ' }}</b>
      <div class="user-signal-sub">{{ row.get('slot_label') or 'SHOWCASE' }}</div>
    </div>
    {% if row.get('robot_instance_id') %}
    <a class="battle-home-link" href="{{ url_for('robot_detail', instance_id=row['robot_instance_id']) }}">見る</a>
    {% endif %}
  </div>
  {% else %}
  <div class="robot-part">まだ展示ロボがありません。</div>
  {% endfor %}
  <div class="link"><a href="{{ url_for('showcase') }}">ロボ展示へ</a></div>
</div>
