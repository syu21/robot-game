{% extends 'base.html' %}
{% block content %}
<div class="panel">
  <h1>研究合成 確認</h1>
  <div class="card">
    <div><b>消費される素材</b></div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">素材A</div>
        <div class="stat-value stat-small">{{ module_a['name_ja'] }}</div>
        <div class="robot-time">{{ module_a['stat_line'] }}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">素材B</div>
        <div class="stat-value stat-small">{{ module_b['name_ja'] }}</div>
        <div class="robot-time">{{ module_b['stat_line'] }}</div>
      </div>
    </div>
    <div class="upgrade-cost">消費コイン: {{ cost_coins }}</div>
    <div class="robot-time">所持コイン: {{ coins_before }}</div>
    <form method="post" action="{{ url_for('modules_synthesis') }}" class="inline-form inline-form-top">
      <input type="hidden" name="module_a_id" value="{{ module_a['instance_id'] }}" />
      <input type="hidden" name="module_b_id" value="{{ module_b['instance_id'] }}" />
      <button type="submit">研究合成を実行する</button>
    </form>
  </div>
  <p class="link"><a class="battle-home-link" href="{{ url_for('modules_synthesis') }}">素材選択へ戻る</a></p>
</div>
{% endblock %}
