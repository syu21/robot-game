{% extends 'base.html' %}
{% block content %}
<section class="mini-tactics-watch" id="miniTacticsWatch">
  <div class="mini-tactics-watch-head">
    <div>
      <h1>ミニロボ戦術試験 #{{ battle['id'] }}</h1>
      <div class="robot-part">seed {{ battle['seed'] }} / {{ battle['status'] }}</div>
    </div>
    <div class="mini-tactics-status-panel">
      <div class="mini-tactics-turn" id="miniTacticsTurn">turn -</div>
      <div class="mini-tactics-result" id="miniTacticsResult"></div>
    </div>
    <div class="mini-tactics-controls">
      <button type="button" id="miniTacticsPrev">1ターン戻る</button>
      <button type="button" id="miniTacticsToggle">一時停止</button>
      <button type="button" id="miniTacticsNext">1ターン進む</button>
      <button type="button" id="miniTacticsReplay">最初から再生</button>
      <label class="mini-tactics-speed">
        速度
        <select id="miniTacticsSpeed">
          <option value="1300">x0.5</option>
          <option value="650" selected>x1</option>
          <option value="325">x2</option>
        </select>
      </label>
      <a class="fuse-secondary-link" href="{{ url_for('admin_lab_mini_tactics') }}">試験一覧</a>
    </div>
  </div>

  <div class="mini-tactics-stage">
    <div class="mini-tactics-board-wrap">
      <div
        class="mini-tactics-board"
        id="miniTacticsBoard"
        style="--mini-tactics-width: {{ map_payload.get('width', 5) }}; --mini-tactics-height: {{ map_payload.get('height', 5) }};"
      ></div>
    </div>

    <aside class="mini-tactics-info-panel">
      <section class="mini-tactics-roster-panel">
        <h2>ユニット情報</h2>
        <div class="mini-tactics-roster" id="miniTacticsRoster">
          <div>
            <h3>味方チーム</h3>
            <div class="mini-tactics-roster-list" id="miniTacticsRosterAlly"></div>
          </div>
          <div>
            <h3>敵チーム</h3>
            <div class="mini-tactics-roster-list" id="miniTacticsRosterEnemy"></div>
          </div>
        </div>
      </section>
      <section class="mini-tactics-log">
        <h2>イベントログ</h2>
        <ul id="miniTacticsLog"></ul>
      </section>
    </aside>
  </div>
</section>

<script>
(function () {
  var mapPayload = {{ map_payload|tojson }};
  var frames = {{ frames_payload|tojson }};
  var unitAssets = {{ unit_assets|tojson }};
  var board = document.getElementById("miniTacticsBoard");
  var turnEl = document.getElementById("miniTacticsTurn");
  var resultEl = document.getElementById("miniTacticsResult");
  var logEl = document.getElementById("miniTacticsLog");
  var rosterEl = document.getElementById("miniTacticsRoster");
  var rosterAllyEl = document.getElementById("miniTacticsRosterAlly");
  var rosterEnemyEl = document.getElementById("miniTacticsRosterEnemy");
  var replayBtn = document.getElementById("miniTacticsReplay");
  var toggleBtn = document.getElementById("miniTacticsToggle");
  var prevBtn = document.getElementById("miniTacticsPrev");
  var nextBtn = document.getElementById("miniTacticsNext");
  var speedSelect = document.getElementById("miniTacticsSpeed");
  if (!board || !turnEl || !logEl || !frames.length) return;

  var width = Number(mapPayload.width || 5);
  var height = Number(mapPayload.height || 5);
  var timer = null;
  var index = 0;
  var isPaused = false;
  var previousPositions = {};

  function tileTerrain(x, y) {
    var rows = mapPayload.tiles || [];
    for (var rowIndex = 0; rowIndex < rows.length; rowIndex += 1) {
      var row = rows[rowIndex] || [];
      for (var colIndex = 0; colIndex < row.length; colIndex += 1) {
        var tile = row[colIndex] || {};
        if (Number(tile.x) === x && Number(tile.y) === y) return String(tile.terrain || "floor");
      }
    }
    return "floor";
  }

  function unitToken(unit) {
    var img = unitAssets[String(unit.unit_id || "")];
    var el = document.createElement("div");
    el.className = "mini-tactics-unit is-" + String(unit.side || "ally");
    if (unit.defeated) el.className += " is-defeated";
    el.setAttribute("data-unit-id", String(unit.unit_id || ""));
    el.title = String(unit.name || "");
    var core = document.createElement("div");
    core.className = "mini-tactics-unit-core";
    if (img) {
      var image = document.createElement("img");
      image.src = img;
      image.alt = String(unit.name || "");
      core.appendChild(image);
    } else {
      core.textContent = String(unit.name || "?").slice(0, 3);
    }
    el.appendChild(core);
    var weapon = document.createElement("div");
    weapon.className = "mini-tactics-weapon";
    weapon.textContent = String(unit.weapon_label || unit.weapon_type || "格闘") + " R" + String(unit.attack_range || unit.range || 1);
    el.appendChild(weapon);
    el.appendChild(hpBar(unit));
    return el;
  }

  function hpBar(unit) {
    var hp = Math.max(0, Number(unit.hp || 0));
    var maxHp = Math.max(1, Number(unit.max_hp || hp || 1));
    var bar = document.createElement("div");
    bar.className = "mini-tactics-hp";
    var fill = document.createElement("span");
    fill.style.width = String(Math.max(0, Math.min(100, Math.round((hp / maxHp) * 100)))) + "%";
    bar.appendChild(fill);
    return bar;
  }

  function resultLabel(result) {
    if (result === "ally_win") return "味方側の勝利";
    if (result === "enemy_win") return "敵側の勝利";
    if (result === "draw") return "10ターン経過で引き分け";
    return "交戦中";
  }

  function renderRoster(frame) {
    if (!rosterEl) return;
    if (rosterAllyEl) rosterAllyEl.innerHTML = "";
    if (rosterEnemyEl) rosterEnemyEl.innerHTML = "";
    (frame.units || []).forEach(function (unit) {
      var row = document.createElement("div");
      row.className = "mini-tactics-roster-row is-" + String(unit.side || "ally");
      if (unit.defeated) row.className += " is-defeated";
      var name = document.createElement("div");
      name.className = "mini-tactics-roster-name";
      name.textContent = String(unit.name || "");
      var hpText = document.createElement("div");
      hpText.className = "mini-tactics-roster-hp";
      hpText.textContent = String(unit.ai_type || "assault") + " / " + String(unit.weapon_label || unit.weapon_type || "格闘") + " / 射程" + String(unit.attack_range || unit.range || 1) + " / HP " + String(Math.max(0, Number(unit.hp || 0))) + "/" + String(Number(unit.max_hp || 0)) + (unit.defeated ? " / 撃破" : "");
      row.appendChild(name);
      row.appendChild(hpText);
      row.appendChild(hpBar(unit));
      if (String(unit.side || "ally") === "enemy") {
        if (rosterEnemyEl) rosterEnemyEl.appendChild(row);
      } else if (rosterAllyEl) {
        rosterAllyEl.appendChild(row);
      }
    });
  }

  function unitElement(unitId) {
    return board.querySelector('[data-unit-id="' + String(unitId).replace(/"/g, "") + '"]');
  }

  function applyMoveAnimation(unit, cell) {
    var unitId = String(unit.unit_id || "");
    var prev = previousPositions[unitId];
    if (!prev) return;
    var dx = Number(prev.x) - Number(unit.x);
    var dy = Number(prev.y) - Number(unit.y);
    if (!dx && !dy) return;
    var rect = cell.getBoundingClientRect();
    var el = cell.querySelector("[data-unit-id]");
    if (!el) return;
    el.style.transform = "translate(" + String(dx * rect.width) + "px, " + String(dy * rect.height) + "px)";
    window.requestAnimationFrame(function () {
      el.classList.add("is-moving");
      el.style.transform = "translate(0, 0)";
    });
  }

  function flashUnit(unitId, className) {
    var el = unitElement(unitId);
    if (!el) return;
    el.classList.add(className);
    window.setTimeout(function () {
      el.classList.remove(className);
    }, 360);
  }

  function flashEvents(frame) {
    (frame.events || []).forEach(function (event) {
      if (event.type === "attack") {
        flashUnit(event.actor_unit_id, "is-attacking");
        flashUnit(event.target_unit_id, "is-hit");
        flashUnit(event.actor_unit_id, "weapon-" + String(event.weapon_type || "melee"));
      }
      if (event.type === "defeated") {
        flashUnit(event.actor_unit_id, "is-ko");
      }
    });
  }

  function renderFrame(frame) {
    var unitsByCell = {};
    (frame.units || []).forEach(function (unit) {
      unitsByCell[String(Number(unit.x)) + "," + String(Number(unit.y))] = unit;
    });
    board.innerHTML = "";
    for (var y = 0; y < height; y += 1) {
      for (var x = 0; x < width; x += 1) {
        var cell = document.createElement("div");
        cell.className = "mini-tactics-cell terrain-" + tileTerrain(x, y);
        var unit = unitsByCell[String(x) + "," + String(y)];
        if (unit) {
          cell.appendChild(unitToken(unit));
          applyMoveAnimation(unit, cell);
        }
        board.appendChild(cell);
      }
    }
    turnEl.textContent = "turn " + String(frame.turn || 0) + " / " + String(frames.length);
    if (resultEl) resultEl.textContent = resultLabel(frame.result || "");
    renderRoster(frame);
    logEl.innerHTML = "";
    (frame.logs || []).forEach(function (line) {
      var li = document.createElement("li");
      li.textContent = String(line || "");
      logEl.appendChild(li);
    });
    window.setTimeout(function () {
      flashEvents(frame);
    }, 40);
    previousPositions = {};
    (frame.units || []).forEach(function (unit) {
      previousPositions[String(unit.unit_id || "")] = {x: Number(unit.x), y: Number(unit.y)};
    });
  }

  function delay() {
    return Number(speedSelect && speedSelect.value ? speedSelect.value : 650);
  }

  function stopTimer() {
    if (timer) window.clearInterval(timer);
    timer = null;
  }

  function play() {
    renderFrame(frames[index]);
    index += 1;
    if (index >= frames.length) {
      stopTimer();
      isPaused = true;
      if (toggleBtn) toggleBtn.textContent = "再開";
    }
  }

  function startTimer() {
    stopTimer();
    if (!isPaused) timer = window.setInterval(play, delay());
  }

  function restart() {
    stopTimer();
    previousPositions = {};
    index = 0;
    isPaused = false;
    if (toggleBtn) toggleBtn.textContent = "一時停止";
    play();
    startTimer();
  }

  function showFrame(nextIndex) {
    stopTimer();
    isPaused = true;
    if (toggleBtn) toggleBtn.textContent = "再開";
    index = Math.max(0, Math.min(frames.length - 1, nextIndex));
    previousPositions = {};
    renderFrame(frames[index]);
    index = Math.min(frames.length, index + 1);
  }

  function toggle() {
    isPaused = !isPaused;
    if (toggleBtn) toggleBtn.textContent = isPaused ? "再開" : "一時停止";
    if (isPaused) {
      stopTimer();
    } else {
      if (index >= frames.length) index = 0;
      startTimer();
    }
  }

  if (replayBtn) replayBtn.addEventListener("click", restart);
  if (toggleBtn) toggleBtn.addEventListener("click", toggle);
  if (prevBtn) prevBtn.addEventListener("click", function () { showFrame(index - 2); });
  if (nextBtn) nextBtn.addEventListener("click", function () { showFrame(index); });
  if (speedSelect) speedSelect.addEventListener("change", startTimer);
  restart();
})();
</script>
{% endblock %}
