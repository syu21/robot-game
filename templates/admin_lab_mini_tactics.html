{% extends 'base.html' %}
{% block content %}
<section class="mini-tactics-admin-hero">
  <div>
    <h1>ミニロボ戦術試験</h1>
    <div class="robot-part">公開準備中のミニロボ対局と、管理者向け戦術演習を分けて確認します。</div>
  </div>
</section>

<section class="mini-tactics-mode-grid">
  <article class="card mini-tactics-mode-card">
    <h2>ロボらぼミニしょうぎ</h2>
    <div class="robot-part">ミニロボを1体ずつ動かして戦う、3×4の小さな盤面バトルです。</div>
    <div class="mini-tactics-controls">
      <a class="fuse-secondary-link" href="{{ url_for('lab_mini_shogi') }}">公開用ミニしょうぎ確認</a>
      <a class="fuse-secondary-link" href="{{ url_for('admin_lab_mini_tactics_manual_new') }}">管理者試験を始める</a>
    </div>
  </article>
  <article class="card mini-tactics-mode-card">
    <h2>ミニロボ戦術演習</h2>
    <div class="robot-part">ステータス、武器、配置を使う大きめの戦術試験です。</div>
    <div class="mini-tactics-controls">
      <a class="fuse-secondary-link" href="{{ url_for('admin_lab_mini_tactics_team') }}">戦術チーム確認</a>
      <a class="fuse-secondary-link" href="{{ url_for('admin_lab_mini_tactics_manual_start') }}">手動戦術演習へ</a>
    </div>
    <details class="mini-tactics-dev-tools">
      <summary>管理者用の自動観戦試験</summary>
      <form method="post" action="{{ url_for('admin_lab_mini_tactics_start') }}" class="post-form mini-tactics-start-form">
        <label>
          seed 任意
          <input type="number" name="seed" min="1" placeholder="空ならランダム" />
        </label>
        <button type="submit">自動watch試験開始</button>
      </form>
    </details>
  </article>
</section>
