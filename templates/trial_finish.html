{% extends 'base.html' %}
{% block content %}
<section class="card">
  <div><span class="weekly-fit-badge">お試しプレイ完了</span></div>
  <h1>ここまで遊んだ内容は保存されません</h1>
  {% if reason == 'time' %}
  <p class="upgrade-cost">お試し時間が終了しました。</p>
  {% elif reason == 'explores' %}
  <p class="upgrade-cost">出撃体験が完了しました。</p>
  {% else %}
  <p class="upgrade-cost">出撃、強化、編成の流れを確認できました。</p>
  {% endif %}
  <p>気に入ったら、自分の研究員としてすぐ始められます。</p>
  <p class="robot-time">今度は自分のロボで、続きから遊ぼう。</p>
  <p class="link"><a class="battle-home-link battle-next-cta" href="{{ url_for('register') }}">無料で始める</a></p>
  <p class="link"><a href="{{ url_for('trial_end') }}">入口へ戻る</a></p>
</section>
{% endblock %}
