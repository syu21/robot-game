{% extends 'base.html' %}
{% block content %}
<h1>試作機登録</h1>

<div class="card lab-upload-hero">
  <div><b>研究機体を提出する</b></div>
  <div class="robot-part">PNG / 透過必須 / 正方形 96px〜512px / 最大1MB。公開は研究所審査後です。</div>
  {% if message %}
  <div class="flash">{{ message }}</div>
  {% endif %}
</div>

<form method="post" enctype="multipart/form-data" class="lab-upload-form" data-lab-stat-form data-max-total="{{ chart_max_total }}">
  <section class="card lab-upload-section">
    <h2>基本情報</h2>
    <div class="lab-field-stack">
      <label for="title">タイトル</label>
      <input id="title" type="text" name="title" maxlength="80" required />
    </div>
    <div class="lab-field-stack">
      <label for="comment">一言コメント</label>
      <textarea id="comment" name="comment" rows="4" maxlength="200" required></textarea>
    </div>
  </section>

  <section class="card lab-upload-section">
    <h2>制作情報</h2>
    <div class="lab-upload-two-col">
      <div class="lab-field-stack">
        <label for="credit_name">表示用クレジット名</label>
        <input id="credit_name" type="text" name="credit_name" maxlength="40" placeholder="空欄ならユーザー名を使います" />
      </div>
      <div class="lab-field-stack">
        <label for="ai_generation_declared">生成AIの利用申告</label>
        <select id="ai_generation_declared" name="ai_generat
